title: "[</br></br></br></br></br>{{< var course.title >}}</br>{{< var course.short >}}</br>Michael Weylandt</br>Week {{< meta session >}} -- {{< meta class_date >}}</br>Last Updated: {{< meta last_updated >}}]{.r-fit-text}"
format:
  revealjs:
    theme: [default, styles.scss]
    title-slide-attributes:
      data-background-image: "../images/baruch_title.png"
      data-background-size: 100% 100%
    auto-stretch: false
    announcement: false
    echo: true
    width: 1280
    height: 720
    center: false

filters:
  - highlight-text
  - embedio
  - meta_filter.lua
  - cascade
